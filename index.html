<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kittu, ye tere liye 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1f2e;--soft:#8c5a6a;--wine:#5b1a33;--rose:#e58fa5;--blush:#fde8ec;--peach:#ffe9dc;--gold:#c0913f;--card:#fffaf6;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Jost,"Helvetica Neue",system-ui,sans-serif;color:var(--ink);overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#fff6f2 0%,var(--blush) 45%,#f9d3de 100%);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-40px;color:#f0a7bb;opacity:.5;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}15%{opacity:.55}100%{transform:translateY(-110vh) translateX(var(--sx)) scale(1.1);opacity:0}}

.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 18px;text-align:center}
.dots{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:#f3c2cf;transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.dots i.on{background:var(--wine);transform:scale(1.35)}
.dots i.done{background:var(--rose)}

.scene{width:100%;display:flex;flex-direction:column;align-items:center}
.scene.in{animation:sceneIn .7s cubic-bezier(.2,1.4,.4,1) both}
.scene.out{animation:sceneOut .35s ease-in both}
@keyframes sceneIn{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes sceneOut{to{opacity:0;transform:translateY(-30px) scale(.95)}}

/* envelope */
.env{position:relative;width:260px;height:180px;margin:40px 0 30px;cursor:pointer;animation:bob 3s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.env .back{position:absolute;inset:0;background:#e98fa6;border-radius:8px}
.env .paper{position:absolute;left:18px;right:18px;top:12px;height:150px;background:#fffaf3;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.7rem;color:var(--wine);transition:transform .9s cubic-bezier(.3,1.3,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.env .front{position:absolute;left:0;top:0;width:0;height:0;border-left:130px solid #f4b9c8;border-right:130px solid #f4b9c8;border-bottom:92px solid #ef9db3;border-top:88px solid transparent;border-radius:0 0 8px 8px;filter:drop-shadow(0 6px 10px rgba(180,60,100,.25))}
.env .flap{position:absolute;left:0;top:0;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-top:100px solid #f8cdd8;transform-origin:50% 0;transition:transform .7s ease,z-index 0s .35s;z-index:3}
.env .seal{position:absolute;left:50%;top:76px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--wine);color:#ffd6df;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:4;animation:beat 1.2s ease-in-out infinite;transition:opacity .3s}
@keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}
.env.open{animation:none}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .paper{transform:translateY(-70px)}
.hello{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(2.2rem,9vw,3rem);color:var(--wine);line-height:1.05}
.tip{color:var(--soft);margin-top:10px;font-size:1.02rem;line-height:1.5;max-width:30ch}

/* item frame */
.hang{position:relative;padding-top:6px;transform-origin:50% 0}
.hang.swing{padding-top:62px}
.hang.swing{animation:swing 3.4s ease-in-out infinite}
.hang.swing::before{content:"";position:absolute;top:0;left:50%;width:2px;height:64px;background:linear-gradient(var(--gold),#e6c88f);transform:translateX(-50%)}
@keyframes swing{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
.frame{position:relative;width:min(78vw,330px,calc((100vh - 360px) * .8));width:min(78vw,330px,calc((100dvh - 360px) * .8));aspect-ratio:4/5;border-radius:999px 999px 20px 20px;border:2px solid var(--gold);padding:6px;background:var(--card);cursor:pointer;box-shadow:0 20px 36px rgba(150,50,90,.22);-webkit-tap-highlight-color:transparent}
.frame:focus-visible{outline:3px solid var(--rose);outline-offset:5px}
.clip{position:relative;width:100%;height:100%;border-radius:999px 999px 14px 14px;overflow:hidden;background:var(--card)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.sl.on{opacity:1}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sl.white{background:#fff}
.sl.white img{object-fit:contain;padding:8%}
.sl.blur img.bgb{filter:blur(16px) saturate(1.1);transform:scale(1.25)}
.sl.blur img.fg{object-fit:contain}
.sl.kb.on img{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translateY(-1.5%)}}
.frame.pop{animation:framePop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes framePop{40%{transform:scale(1.07) rotate(-1.5deg)}70%{transform:scale(.97) rotate(1deg)}}
.pg{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:5}
.pg i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 4px rgba(0,0,0,.35)}
.pg i.on{background:#fff;transform:scale(1.25)}

/* fx */
.shine::after{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{55%,100%{transform:translateX(120%)}}
.steam{position:absolute;z-index:4;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);filter:blur(4px);opacity:0;animation:steam 3s ease-out infinite;pointer-events:none}
@keyframes steam{0%{transform:translateY(40px) scale(.6);opacity:0}30%{opacity:.85}100%{transform:translateY(-90px) translateX(var(--w)) scale(1.5);opacity:0}}
.star{position:absolute;z-index:6;width:20px;height:20px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px #ffd98a);animation:tw 2.2s ease-in-out infinite;opacity:0;pointer-events:none}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.2) rotate(90deg);opacity:1}}
.bounce{animation:teddy 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes teddy{0%,100%{transform:translateY(0) scale(1,1) rotate(0)}20%{transform:translateY(-14px) scale(.97,1.04) rotate(-2deg)}40%{transform:translateY(0) scale(1.04,.95)}60%{transform:translateY(-8px) rotate(2deg)}80%{transform:translateY(0) scale(1.02,.98)}}
.jelly{animation:jelly 2.6s ease-in-out infinite}
@keyframes jelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.04,.96)}50%{transform:scale(.97,1.03)}75%{transform:scale(1.02,.98) rotate(.6deg)}}

h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(1.9rem,7vw,2.4rem);color:var(--wine);margin-top:16px;line-height:1.05}
.line{color:var(--soft);font-size:1.02rem;line-height:1.5;margin-top:8px;max-width:32ch;min-height:3em}
.btn{margin-top:14px;font:inherit;font-weight:500;letter-spacing:.03em;color:#fff;background:var(--wine);border:1.5px solid var(--gold);border-radius:999px;padding:13px 32px;cursor:pointer;box-shadow:0 8px 18px rgba(91,26,51,.25);transition:transform .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
.ghost{background:transparent;color:var(--wine);box-shadow:none;margin-top:10px}

/* final */
.letter{background:var(--wine);color:#fbe9e4;border:1.5px solid var(--gold);border-radius:24px;padding:26px 20px 24px;width:100%;box-shadow:0 20px 40px rgba(91,26,51,.35)}
.thumbs{display:flex;justify-content:center;margin-bottom:16px}
.thumbs span{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--gold);background-size:cover;background-position:center;margin:0 -7px;opacity:0;animation:tpop .6s cubic-bezier(.2,1.8,.4,1) both;background-color:#fff}
@keyframes tpop{from{opacity:0;transform:scale(0) translateY(20px)}to{opacity:1;transform:none}}
.letter .big{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.15;color:#fff}
.letter .gl{display:block;width:44px;height:2px;background:var(--gold);margin:16px auto}
.letter .sub{font-size:1.1rem;color:#efcdd0;line-height:1.55}
.hug{display:inline-block;font-size:2rem;margin-top:8px;animation:teddy 1.6s ease-in-out infinite}

.pf{position:fixed;z-index:30;pointer-events:none;font-size:24px;animation:pf 1.2s ease-out forwards}
@keyframes pf{to{transform:translate(var(--dx),var(--dy)) scale(.5) rotate(var(--r));opacity:0}}
.toast{position:fixed;z-index:31;pointer-events:none;background:#fff;color:var(--wine);padding:6px 14px;border-radius:999px;font-size:.95rem;box-shadow:0 6px 16px rgba(150,50,90,.25);animation:tst 1.5s ease-out forwards;white-space:nowrap}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
@media (max-height:640px){.env{margin:20px 0 14px;transform:scale(.85)}.line{min-height:0}h2{margin-top:10px}}
@media (prefers-reduced-motion:reduce){.fl,.steam,.star,.shine::after,.swing,.bounce,.jelly,.env,.seal,.hug,.sl.kb.on img{animation:none!important}.scene.in{animation:none}.pf,.toast{display:none}}

/* ===== extra cute layer ===== */
body{background:radial-gradient(circle,#ffbfd3 1.8px,transparent 2.4px) 0 0/28px 28px,linear-gradient(160deg,#fff5f8,#ffe0ea 55%,#ffd1e0);font-family:"Baloo 2",Jost,system-ui,sans-serif}
.hello,h2{font-family:"Baloo 2",system-ui,sans-serif;font-style:normal;font-weight:800;color:#d6457a;text-shadow:2px 2px 0 #fff,0 6px 14px rgba(214,69,122,.2)}
.hello{font-size:clamp(2rem,8.5vw,2.8rem)}
h2{font-size:clamp(1.7rem,6.5vw,2.2rem);margin-top:14px}
.dots i{background:none!important;width:auto;height:auto;border-radius:0;font-style:normal;color:#f7b4c7;font-size:17px;line-height:1}
.dots i::before{content:"\2665"}
.dots i.on{color:#d6457a;transform:scale(1.45);animation:beat2 1s ease-in-out infinite}
.dots i.done{color:#ff8fb3}
@keyframes beat2{50%{transform:scale(1.7)}}
.frame{width:min(76vw,320px,calc((100vh - 390px) * .8));width:min(76vw,320px,calc((100dvh - 390px) * .8));border:9px solid #fff;border-radius:30px;padding:0;background:#fff;box-shadow:0 10px 0 rgba(255,150,185,.4),0 22px 34px rgba(214,69,122,.25);transform:rotate(-2deg)}
.clip{border-radius:21px}
.frame::before{content:"";position:absolute;top:-20px;left:50%;width:92px;height:26px;margin-left:-46px;transform:rotate(-4deg);z-index:9;background:repeating-linear-gradient(45deg,#ffb6cc 0 8px,#fff3f7 8px 16px);opacity:.92;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.hang.swing .frame::before{display:none}
.stk{position:absolute;z-index:10;width:54px;height:54px;border-radius:50%;background:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(214,69,122,.35);animation:wig 2.4s ease-in-out infinite;pointer-events:none;border:3px solid #ffd3e0}
.stk.a{right:-24px;top:34px}.stk.b{left:-24px;bottom:30px;animation-delay:-1.2s}
@keyframes wig{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.14)}}
.say{display:flex;align-items:flex-end;gap:10px;margin-top:12px;width:100%;max-width:380px;text-align:left}
.mascot{width:68px;height:68px;flex:none;animation:mb 1.8s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 4px 6px rgba(150,70,20,.25))}
@keyframes mb{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{position:relative;flex:1;background:#fff;border-radius:22px;padding:10px 15px;font-size:1.02rem;line-height:1.4;color:#8a2f55;font-weight:500;min-height:3.4em;box-shadow:0 6px 0 rgba(255,150,185,.35)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:20px;border:9px solid transparent;border-left:0;border-right-color:#fff}
.btn{font-family:"Baloo 2",system-ui,sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:0;color:#fff;background:linear-gradient(#ff93b5,#ff6b9c);border:3px solid #fff;border-radius:999px;padding:8px 30px;box-shadow:0 6px 0 #d6457a,0 14px 20px rgba(214,69,122,.3);margin-top:16px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #d6457a}
.ghost{background:#fff;color:#d6457a;box-shadow:0 5px 0 #ffc0d3;border-color:#ffd3e0}
.letter{background:linear-gradient(160deg,#ff93b5,#e0558a);border:5px solid #fff;color:#fff;box-shadow:0 10px 0 rgba(255,150,185,.45),0 24px 40px rgba(214,69,122,.35)}
.letter .big{font-family:"Baloo 2",system-ui,sans-serif;font-style:normal;font-weight:800;text-shadow:0 3px 0 rgba(150,30,80,.35)}
.letter .sub{color:#fff0f4;font-weight:500}
.letter .gl{background:#fff;border-radius:2px}
.thumbs span{border-color:#fff;box-shadow:0 4px 8px rgba(120,20,60,.3)}
.env .paper{font-family:"Baloo 2",system-ui,sans-serif;font-style:normal;font-weight:800;color:#d6457a}
.tr{position:fixed;z-index:25;pointer-events:none;font-size:16px;animation:trl .9s ease-out forwards}
@keyframes trl{to{transform:translateY(-26px) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.stk,.mascot,.eye,.dots i.on{animation:none!important}.tr{display:none}}
</style>
</head>

<main class="app" id="app">

  <div class="scene" id="scene" aria-live="polite"></div>
</main>

 {id:"saree",t:"Sundar Saree",line:"Sunsundar saree, aur usme meri Kittu. Bas, ho gaya perfect! 🥻",modes:["cover","cover","cover"],fx:"shine",pf:["🥻","✨","💗"]},
 {id:"teddy",t:"Cute Teddy",line:"Ye bilkul mere jaisa hai 🧸 Tight hug, koi sawaal nahi!",modes:["white"],fx:"bounce",pf:["🧸","💗","🤍"]},
 {id:"rasmalai",t:"Rasmalai",line:"Aur last mein meetha! Kesar-pista rasmalai, poori teri. Share nahi karna 😋",modes:["blur","blur"],fx:"jelly",pf:["🍮","✨","💛"]}
];
var MASCOT='<svg class="mascot" viewBox="0 0 80 80" aria-hidden="true"><circle cx="17" cy="20" r="12" fill="#c98a4f"/><circle cx="63" cy="20" r="12" fill="#c98a4f"/><circle cx="17" cy="20" r="6" fill="#ffc2d3"/><circle cx="63" cy="20" r="6" fill="#ffc2d3"/><circle cx="40" cy="44" r="32" fill="#d9a066"/><ellipse cx="40" cy="54" rx="14" ry="10" fill="#f6dfb9"/><ellipse class="eye" cx="28" cy="40" rx="3.6" ry="4.4" fill="#4a1f2e"/><ellipse class="eye" cx="52" cy="40" rx="3.6" ry="4.4" fill="#4a1f2e"/><circle cx="29.2" cy="38.6" r="1.2" fill="#fff"/><circle cx="53.2" cy="38.6" r="1.2" fill="#fff"/><ellipse cx="40" cy="50" rx="4.5" ry="3.2" fill="#4a1f2e"/><path d="M34 56q6 6 12 0" stroke="#4a1f2e" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="18" cy="52" rx="6" ry="4" fill="#ff9fb8" opacity=".75"/><ellipse cx="62" cy="52" rx="6" ry="4" fill="#ff9fb8" opacity=".75"/><path d="M62 8l10-5v14zM62 8l-10-5v14z" fill="#ff6b9c"/><circle cx="62" cy="10" r="3" fill="#d6457a"/></svg>';
var STK={momos:["🥟","🌶️"],jhumka:["✨","💖"],saree:["🌸","💃"],teddy:["💗","🎀"],rasmalai:["🍯","⭐"]};
function stk(s){var a=STK[s.id];return '<span class="stk a">'+a[0]+'</span><span class="stk b">'+a[1]+'</span>'}
function typeText(el,txt){if(!el)return;if(reduce){el.textContent=txt;return}var k=0;el.textContent='';var id=setInterval(function(){el.textContent=txt.slice(0,++k);if(k>=txt.length)clearInterval(id)},26);timers.push(id)}
var lastTr=0;
function trail(e){var t=Date.now();if(t-lastTr<70||reduce)return;lastTr=t;var p=e.touches?e.touches[0]:e;if(!p)return;
  var s=document.createElement('span');s.className='tr';s.textContent=['✨','💗','⭐','🌸'][Math.floor(Math.random()*4)];
  s.style.left=(p.clientX-8)+'px';s.style.top=(p.clientY-8)+'px';document.body.appendChild(s);setTimeout(function(){s.remove()},900)}
window.addEventListener('pointermove',trail,{passive:true});
window.addEventListener('touchmove',trail,{passive:true});
var REACT=["Haaye, kitna pyaara 😍","Smile aayi? 😊","Mujhe pata tha tujhe pasand aayega","Aur dekh, aur bhi hai!","Mood ban gaya na? ✨","Bas, ab chinta bye bye"];

var app=document.getElementById('app'),scene=document.getElementById('scene'),
    dotsEl=document.getElementById('dots'),bg=document.getElementById('bg'),
    reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    timers=[],cur=-1;

STEPS.forEach(function(){dotsEl.appendChild(document.createElement('i'))});

// soft floating hearts
if(!reduce){for(var i=0;i<14;i++){var f=document.createElement('span');f.className='fl';f.textContent=['♥','♡','✦'][i%3];
  f.style.left=Math.random()*100+'%';f.style.fontSize=(12+Math.random()*16)+'px';
  f.style.setProperty('--sx',(Math.random()*80-40)+'px');
  f.style.animationDuration=(10+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*14)+'s';bg.appendChild(f)}}

function clearT(){timers.forEach(function(t){clearInterval(t);clearTimeout(t)});timers=[]}
function setDots(i){[].forEach.call(dotsEl.children,function(d,k){d.className=k<i?'done':(k===i?'on':'')})}

function burst(x,y,set,n){
  if(reduce)return;
  for(var i=0;i<(n||9);i++){var b=document.createElement('span');b.className='pf';b.textContent=set[i%set.length];
    var a=Math.random()*6.283,d=50+Math.random()*110;
    b.style.left=x+'px';b.style.top=y+'px';
    b.style.setProperty('--dx',Math.cos(a)*d+'px');b.style.setProperty('--dy',(Math.sin(a)*d-50)+'px');
    b.style.setProperty('--r',(Math.random()*160-80)+'deg');
    document.body.appendChild(b);setTimeout(function(e){e.remove()},1300,b)}
}
function toast(x,y,txt){
  if(reduce)return;var t=document.createElement('div');t.className='toast';t.textContent=txt;
  t.style.left=Math.min(Math.max(x,110),window.innerWidth-110)+'px';t.style.top=y+'px';
  document.body.appendChild(t);setTimeout(function(){t.remove()},1500)
}
function rain(set,n){
  if(reduce)return;
  for(var i=0;i<n;i++)(function(i){setTimeout(function(){
    burst(Math.random()*window.innerWidth,window.innerHeight*(0.15+Math.random()*0.5),set,2)},i*90)})(i)
}

function swap(html,after){
  if(scene.firstChild&&!reduce){scene.className='scene out';
    setTimeout(function(){scene.innerHTML=html;scene.className='scene in';after&&after()},330)}
  else{scene.innerHTML=html;scene.className='scene in';after&&after()}
}

function intro(){
  clearT();cur=-1;setDots(-1);
  swap('<div class="env" id="env" role="button" tabindex="0" aria-label="Khol ke dekh"><div class="back"></div><div class="paper">Kittu 💖</div><div class="front"></div><div class="flap"></div><div class="seal">♥</div></div>'+
       '<h1 class="hello">Kittu, ye tere liye 🎀</h1><div class="say">'+MASCOT+'<div class="bubble" id="bub"></div></div>',
  function(){
    typeText(document.getElementById('bub'),'Kittu!! Tap karke khol na, tere liye kuch laaya hoon 🎀');var env=document.getElementById('env'),done=false;
    function open(e){if(done)return;done=true;env.classList.add('open');
      var r=env.getBoundingClientRect();burst(r.left+r.width/2,r.top+40,['💖','✨','💌'],10);
      setTimeout(function(){show(0)},1100)}
    env.addEventListener('click',open);
    env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  });
}

function slidesHTML(s){
  var arr=IMG[s.id];
  return arr.map(function(u,i){var m=s.modes[i];
    var inner=m==='blur'?'<img class="bgb" alt="" src="'+u+'"><img class="fg" alt="'+s.t+'" src="'+u+'">':'<img alt="'+s.t+'" src="'+u+'">';
    return '<div class="sl '+m+(s.id==='saree'?' kb':'')+(i?'':' on')+'">'+inner+'</div>'}).join('');
}

function show(i){
  clearT();cur=i;setDots(i);
  var s=STEPS[i],n=IMG[s.id].length,last=i===STEPS.length-1;
  var fxIn='',fxOut='',cls='frame';
  if(s.fx==='steam')fxIn='<span class="steam" style="left:30%;top:28%;--w:-14px"></span><span class="steam" style="left:46%;top:24%;--w:10px;animation-delay:1s"></span><span class="steam" style="left:58%;top:30%;--w:16px;animation-delay:2s"></span>';
  if(s.fx==='swing')fxIn='<span class="star" style="left:22%;top:50%"></span><span class="star" style="left:70%;top:46%;animation-delay:.8s"></span><span class="star" style="left:46%;top:66%;animation-delay:1.5s"></span>';
  if(s.fx==='jelly')fxIn='<span class="star" style="left:18%;top:26%"></span><span class="star" style="left:74%;top:34%;animation-delay:1s"></span>';
  var hang=s.fx==='swing'?'hang swing':'hang';
  var inner='<div class="'+cls+(s.fx==='bounce'?' bounce':'')+(s.fx==='jelly'?' jelly':'')+'" id="fr" role="button" tabindex="0" aria-label="'+s.t+', tap karo"><div class="clip'+(s.fx==='shine'?' shine':'')+'">'+slidesHTML(s)+fxIn+(n>1?'<div class="pg">'+IMG[s.id].map(function(u,k){return '<i'+(k?'':' class="on"')+'></i>'}).join('')+'</div>':'')+'</div>'+stk(s)+'</div>';
  swap('<div class="'+hang+'">'+inner+'</div><h2>'+s.t+'</h2><div class="say">'+MASCOT+'<div class="bubble" id="bub"></div></div>'+
       '<button class="btn" id="nx">'+(last?'Aakhri baat 💌':'Aage dekh 💕')+'</button>',
  function(){
    typeText(document.getElementById('bub'),s.line);var fr=document.getElementById('fr'),sl=fr.querySelectorAll('.sl'),pg=fr.querySelectorAll('.pg i'),k=0;
    function nextSlide(){if(sl.length<2)return;sl[k].classList.remove('on');pg[k]&&pg[k].classList.remove('on');k=(k+1)%sl.length;sl[k].classList.add('on');pg[k]&&pg[k].classList.add('on')}
    if(n>1)timers.push(setInterval(nextSlide,2600));
    if(s.fx==='bounce')timers.push(setInterval(function(){var r=fr.getBoundingClientRect();burst(r.left+r.width*(0.2+Math.random()*0.6),r.top+10,['💗','🤍'],1)},1100));
    function tap(e){
      var r=fr.getBoundingClientRect(),x=(e&&e.clientX)||r.left+r.width/2,y=(e&&e.clientY)||r.top+r.height/2;
      burst(x,y,s.pf,10);toast(x,y-20,REACT[Math.floor(Math.random()*REACT.length)]);
      fr.classList.remove('pop');void fr.offsetWidth;fr.classList.add('pop');nextSlide()}
    fr.addEventListener('click',tap);
    fr.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
    document.getElementById('nx').addEventListener('click',function(){last?finale():show(i+1)});
  });
}

function finale(){
  clearT();cur=STEPS.length;setDots(STEPS.length);
  var th=['momos','jhumka','saree','teddy','rasmalai'].map(function(k,j){
    return '<span style="background-image:url('+IMG[k][0]+');animation-delay:'+(0.4+j*0.15)+'s"></span>'}).join('');
  swap('<div class="letter"><div class="thumbs">'+th+'</div><p class="big">Kittu, chinta kyu karti hai?<br>Main hoon na!</p><span class="gl"></span><p class="sub">Chal, ye sab leke aate hain.</p><span class="hug">🧸</span></div>'+
       '<button class="btn ghost" id="again">Phir se dekh 🔁</button>',
  function(){
    document.getElementById('again').addEventListener('click',function(){show(0)});
    rain(['💖','🧸','✨','🥟','🍮','💗'],26);
    timers.push(setInterval(function(){rain(['💗','✨'],4)},2600));
  });
}
intro();
</script>
</body>
</html>
